<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisar solicitud de recuperacion</title>
</head>
<body>
    <main>
        
        <div id="NombreObjeto">Nombre</div>
        <div id="Descripcion">Descripcion</div>
        <div id="Categoria">Categoria
            <label id="categoryName">Nombre categoria</label>
        </div>
        <div id="Lugar">Lugar
            <label id="placeName">Nombre lugar</label>
        </div>
        <div id="Fecha">Fecha
            <label id="reportedDate">Fecha de reporte</label>
        </div>
        <div id="Hora">Hora
            <label id="reportedTime">Hora del reporte</label>
        </div>

        <div id="reporterInfo">
            <label>USUARIO QUE REPORTÓ</label>
            <label id="user">Nombre reportante</label>
            <label id="email">Email reportante</label>
            <label id="privateData">Dato Privado:</label>
        </div>

        <button id="btn-approve">Aprobar</button>
        <button id="btn-deny">Rechazar</button>
    </main>
    <script type="module" src="./presenter.js"></script>
</body>
</html>
