
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatoFind | Iniciar sesión</title>
  <link rel="stylesheet" href="./login.css">
</head>
<body>

  <main class="login">

    
<section class="login__presentacion">

  <div class="login__marca">
    <img src="../../../../../assets/images/ucb.png"
         alt="Escudo UCB">

    <div>
      <strong>CATO<span>FIND</span></strong>
      <small>UCB COCHABAMBA</small>
    </div>
  </div>

  <div class="login__mensaje">

    <div class="login__linea"></div>

    <h1>
      No todo está
      <span>perdido.</span>
    </h1>

    <p>
      Busca, reporta y recupera objetos dentro de la comunidad
      UCB, sin perderte entre mensajes de WhatsApp.
    </p>

    
<div class="login__imagenes">

  <img src="../../../../../assets/images/mochila.jpg"
       alt="Mochila">

  <img src="../../../../../assets/images/perro.jpg"
       alt="Perro">

  <img src="../../../../../assets/images/audifonos.jpg"
       alt="Audífonos">

</div>


  </div>

</section>


    <section class="login__acceso">
          <div class="login__contenido">

            
<div class="login__logo-ucb">

  <img
    src="../../../../../assets/images/ucb.png"
    alt="Escudo Universidad Católica Boliviana"
  >

  <div class="login__logo-texto">
    <span>UNIVERSIDAD</span>
    <strong>CATÓLICA</strong>
    <span>BOLIVIANA</span>
  </div>

</div>


      <h2>Iniciar sesión</h2>
      <p>Usa tu correo institucional.</p>

      <form id="login-form" novalidate>
        <input
          type="email"
          id="correo"
          placeholder="Correo institucional"
          aria-label="Correo institucional"
          required
        >

        <input
          type="password"
          id="contrasena"
          placeholder="Contraseña"
          aria-label="Contraseña"
          required
        >

        <button type="submit">Iniciar sesión</button>

        <p id="mensaje-error" role="alert"></p>
      </form>

      <div class="login__enlaces">
        <a href="../registro/registro.html">Registrarse</a>
        <button type="button" id="recuperar-contrasena">Recuperar contraseña</button>
      </div>
        
    </div>
    </section>

  </main>

  <script type="module" src="./loginPresenter.js"></script>

</body>
</html>
