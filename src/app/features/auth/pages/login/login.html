
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>CatoFind | Iniciar sesión</title>

  <link rel="stylesheet"
        href="./src/app/features/auth/pages/login/login.scss">
</head>
<body>
  <main class="login">

    <section class="login__presentacion"
             aria-labelledby="lema">

      <div class="login__marca">
        CATO<span>FIND</span>
      </div>

      <div class="login__mensaje">
        <div class="login__linea"
             aria-hidden="true"></div>

        <h1 id="lema">
          No todo está
          <span>perdido.</span>
        </h1>

        <p>
          Busca, reporta y recupera objetos dentro
          de la comunidad UCB, sin perderte entre
          mensajes de WhatsApp.
        </p>
      </div>

    </section>

    <section class="login__acceso"
             aria-labelledby="titulo-login">

      <div class="login__acceso-contenido">
        <h2 id="titulo-login">Iniciar sesión</h2>
        <p>Usa tu correo institucional.</p>
      </div>

    </section>

  </main>
</body>
</html>
