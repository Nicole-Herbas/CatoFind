<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f9fc">
    <title>CatoFind | Solicitar recuperación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./recoveryRequest.css">
</head>
<body>
    <div id="shared-navbar" data-pagina="recoveryRequest" data-rol="ESTUDIANTE"></div>

    <main>
        <h2>Pregutas de verificación</h2>
        <p id="elegir-objeto" role="status" hidden>
            Primero elige un objeto en <a href="../../buscar/pages/buscar/buscar.html">Buscar</a> para solicitar su recuperación.
        </p>
        <form class="recoveryForm" novalidate>
            <label>¿Dónde crees que perdiste el objeto?</label>
            <select id="locations" required aria-describedby="extraDescriptionError">
                <option value="">Selecciona un lugar</option>
                <option value="biblioteca">Biblioteca</option>
                <option value="cafeteria">Cafetería</option>
                <option value="bloqueA">Bloque A</option>
                <option value="bloqueB">Bloque B</option>
                <option value="auditorio">Auditorio</option>
                <option value="estacionamiento">Estacionamiento</option>
                <option value="patio">Patio</option>
                <option value="laboratorio">Laboratorio</option>
                <option value="administracion">Administración</option>
            </select>

        <nav class="navbar__links" aria-label="Navegación principal">
            <a href="../../inicio/pages/inicio/inicio.html" class="navbar__link">Inicio</a>
            <a href="../../buscar/pages/buscar/buscar.html" class="navbar__link">Buscar</a>
            <a href="./recoveryRequest.html" class="navbar__link navbar__link--active" aria-current="page">Reportar</a>
            <a href="#" class="navbar__link">Mis reportes</a>
        </nav>
    </header>

    <main class="recovery">
        <div class="recovery__contenido">
            <header class="recovery__encabezado">
                <h1>Solicitar recuperación</h1>
                <p>Cuéntanos algunos detalles para verificar que el objeto te pertenece.</p>
            </header>

            <form class="recoveryForm" novalidate>
                <div class="recovery__campo">
                    <label for="locations">¿Dónde crees que perdiste el objeto?</label>
                    <select id="locations" required aria-describedby="extraDescriptionError">
                        <option value="">Selecciona una zona del campus...</option>
                        <option value="biblioteca">Biblioteca</option>
                        <option value="cafeteria">Cafetería</option>
                        <option value="bloqueA">Bloque A</option>
                        <option value="bloqueB">Bloque B</option>
                        <option value="auditorio">Auditorio</option>
                        <option value="estacionamiento">Estacionamiento</option>
                        <option value="patio">Patio</option>
                        <option value="laboratorio">Laboratorio</option>
                        <option value="administracion">Administración</option>
                    </select>
                </div>

                <div class="recovery__campo">
                    <label for="dateLost">¿Cuándo aproximadamente lo perdiste?</label>
                    <input id="dateLost" type="date" required aria-describedby="extraDescriptionError">
                </div>

                <div class="recovery__campo">
                    <label for="extraDescriptionObject">Describe una característica que no aparece en la publicación.</label>
                    <textarea
                        id="extraDescriptionObject"
                        placeholder="Ej. Tiene una costura en la manga"
                        required
                        aria-describedby="extraDescriptionError"
                    ></textarea>
                </div>

                <p id="extraDescriptionError" class="recovery__error" role="alert" hidden></p>

                <div class="recovery__acciones">
                    <button id="sendRequest" class="btn-sendRequest" type="submit">Enviar solicitud</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module" src="../../../shared/components/navbar/navbar.js"></script>
    <script type="module" src="./presenter.js"></script>
</body>
</html>
