<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Recueración</title>
</head>
<body>
    
    <main>
        <h2>Pregutas de verificación</h2>
        <form class="recoveryForm" novalidate>
            <label>¿Dónde crees que perdiste el objeto?</label>
            <select id="locations">
                <option value="biblioteca">Biblioteca</option>
                <option value="cafeteria">Cafetería</option>
                <option value="bloqueA">Bloque A</option>
                <option value="bloqueB">Bloque B</option>
                <option value="auditorio">Auditorio</option>
                <option value="estacionamiento">Estacionamiento</option>
                <option value="patio">Patio</option>
                <option value="laboratorio">Laboratorio</option>
                <option value="administracion">Administración</option>
            </select>

            <label>¿Cuándo aproximadamente lo perdiste?</label>
            <input type="date" value>

            <label>Describe una característica que no aparece en la publicación.</label>
            <textarea id="extraDescriptionObject" placeholder="Ej. En la manga de la chompa esta costurado" required aria-describedby="extraDescriptionError"></textarea>
            <p id="extraDescriptionError" class="error-message" role="alert" hidden></p>

            <button id="sendRequest" class="btn-sendRequest">Enviar Solicitud</button>
        </form>
    </main>


    <script type="module" src="./presenter.js"></script>
</body>
</html>
